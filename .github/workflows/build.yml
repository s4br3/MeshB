name: Multi-Platform Build

on:
  push:
    branches: [ "master", "NoGmsh" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "NoGmsh" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgmsh-dev libomp-dev

    - name: Setup MSYS2 MinGW GCC (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          zip

    - name: Download Gmsh SDK (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        curl -L "https://gmsh.info/bin/Windows/gmsh-4.13.1-Windows64-sdk.zip" -o gmsh.zip
        unzip -q gmsh.zip

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/gmsh-4.13.1-Windows64-sdk"

    - name: Build Project (Linux)
      if: runner.os == 'Linux'
      run: cmake --build build --config Release --parallel 4

    - name: Build Project (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config Release --parallel 4

    - name: Copy Gmsh DLL to Build Folder (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        if [ -d "gmsh-4.13.1-Windows64-sdk" ]; then
          mkdir -p build
          cp gmsh-4.13.1-Windows64-sdk/bin/gmsh.dll build/ 2>/dev/null || true
        fi

    - name: Package for Release (Linux)
      if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
      run: zip -j MeshB-${{ github.ref_name }}-Linux.zip build/main

    - name: Package for Release (Windows)
      if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        FILES="build/main.exe"
        if [ -f "build/gmsh.dll" ]; then FILES="$FILES build/gmsh.dll"; fi
        zip -j MeshB-${{ github.ref_name }}-Windows.zip $FILES

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: MeshB-*.zip